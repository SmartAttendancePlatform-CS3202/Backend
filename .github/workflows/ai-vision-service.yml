name: ai-vision-service

on:
  push:
    branches: [main]
    paths:
      - "services/ai-vision-service/**"
      - "libs/shared-core/**"
  pull_request:
    paths:
      - "services/ai-vision-service/**"
      - "libs/shared-core/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./libs/shared-core
      - run: pip install -e ./services/ai-vision-service
      - run: pip install pytest
      - run: pytest services/ai-vision-service/tests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "${{ secrets.RENDER_AI_VISION_SERVICE_DEPLOY_HOOK }}"
