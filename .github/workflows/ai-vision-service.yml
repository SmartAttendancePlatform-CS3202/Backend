name: ai-vision-service

on:
  push:
    branches: [main]
    paths:
      - "services/ai-vision-service/**"
      - "libs/shared-core/**"
      - ".github/workflows/ai-vision-service.yml"
  pull_request:
    paths:
      - "services/ai-vision-service/**"
      - "libs/shared-core/**"
      - ".github/workflows/ai-vision-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./libs/shared-core
      - run: pip install -e ./services/ai-vision-service
      - run: pip install pytest httpx
      - run: pytest services/ai-vision-service/tests

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ai-vision-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-vision-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-vision-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
