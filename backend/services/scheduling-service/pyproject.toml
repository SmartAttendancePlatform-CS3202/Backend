[project]
name = "scheduling-service"
version = "0.1.0"
description = "Courses, offerings, and timetable management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "shared-core",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
