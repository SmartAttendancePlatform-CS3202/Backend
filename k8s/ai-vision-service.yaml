apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-vision-service
  namespace: smart-attendance
  labels:
    app: ai-vision-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-vision-service
  template:
    metadata:
      labels:
        app: ai-vision-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting for rabbitmq..."; sleep 3; done
      containers:
        - name: ai-vision-service
          image: DOCKERHUB_USERNAME_PLACEHOLDER/ai-vision-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-vision-service
  namespace: smart-attendance
spec:
  type: ClusterIP
  selector:
    app: ai-vision-service
  ports:
    - port: 8000
      targetPort: 8000
