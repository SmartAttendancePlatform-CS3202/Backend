apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: smart-attendance
data:
  SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  SCHEDULING_SERVICE_URL: "http://scheduling-service:8000"
  AI_VISION_SERVICE_URL: "http://ai-vision-service:8000"
  ATTENDANCE_SERVICE_URL: "http://attendance-service:8000"
  ALLOWED_ORIGINS: "https://attendance.example.com"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  VERIFICATION_QUEUE_NAME: "face_verification_queue"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.tracing.svc.cluster.local:4317"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_PROPAGATORS: "tracecontext,baggage"
