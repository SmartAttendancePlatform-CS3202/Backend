apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-attendance-ingress
  namespace: smart-attendance
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - attendance.example.com
      secretName: smart-attendance-tls
  rules:
    - host: attendance.example.com
      http:
        paths:
          - path: /scheduling
            pathType: Prefix
            backend:
              service:
                name: scheduling-service
                port:
                  number: 8000
          - path: /attendance
            pathType: Prefix
            backend:
              service:
                name: attendance-service
                port:
                  number: 8000
          # ai-vision-service intentionally has no public ingress route.
