_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:8081
        - https://directx-web.vercel.app
      methods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Internal-Key
        - X-Request-ID
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:
  - name: scheduling-service
    url: http://scheduling-service:8000
    routes:
      - name: scheduling-route
        paths: ["/scheduling"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  - name: attendance-service
    url: http://attendance-service:8000
    routes:
      - name: attendance-route
        paths: ["/attendance"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

# ai-vision-service deliberately has no public Kong route. It stays inside the Docker/Kubernetes network.
