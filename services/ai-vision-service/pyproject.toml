[project]
name = "ai-vision-service"
version = "0.1.0"
description = "Face embedding extraction and matching for identity verification"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "shared-core",
    # Add your chosen face model's library here, e.g. one of:
    # "deepface>=0.0.93"       # ArcFace/Facenet512/etc, easiest to start with
    # "face-recognition>=1.3"  # dlib-based, 128-d embeddings
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]
