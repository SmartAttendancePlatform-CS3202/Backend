[project]
name = "ai-vision-service"
version = "0.1.0"
description = "Face embedding extraction and matching for identity verification"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "shared-core",
    "aio-pika>=9.0",
    "deepface>=0.0.93",
    "opencv-python-headless>=4.9",
    "tf-keras",
    "psycopg2-binary>=2.9"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]
