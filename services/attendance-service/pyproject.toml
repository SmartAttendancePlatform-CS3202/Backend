[project]
name = "attendance-service"
version = "0.1.0"
description = "Lecture sessions, check-ins, geofence/verification orchestration, notifications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "aio-pika>=9.0",
    "shared-core",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]